name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-nsis:
    name: Windows x64 NSIS installer
    if: github.event_name != 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content src/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag) {
            throw "Tag '$env:GITHUB_REF_NAME' must match app version '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$($config.productName)_${version}_x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src -> target

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Build NSIS installer
        working-directory: src
        run: npm run package -- -- --locked

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenosStyleStudio-${{ steps.version.outputs.version }}-windows-x64-setup
          path: src/target/release/bundle/nsis/${{ steps.version.outputs.installer }}
          if-no-files-found: error

      - name: Add installer and notes to GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.version.outputs.installer }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = "src/target/release/bundle/nsis/$env:INSTALLER"
          $notes = @"
          Windows x64 installer for Genos Style Studio $env:APP_VERSION.

          ## Install

          Download **$env:INSTALLER**, run it, and launch **GenosStyleStudio** from the Start menu. The app requires WebView2 on Windows 10 or 11. The installer is unsigned, so SmartScreen may warn.
          "@
          if ($env:APP_VERSION -match '-alpha(?:\.|$)') {
            $notes = "This alpha is intended for early testing. Hardware qualification and expansion recovery are still in progress.`n`n$notes"
          }

          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | @json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $release = $releases | ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object tag_name -CEQ $tag | Select-Object -First 1

          if (-not $release) {
            $flags = @()
            if (($env:APP_VERSION -split '\+', 2)[0].Contains('-')) { $flags += '--prerelease' }
            gh release create $tag $asset --verify-tag --draft --title "Genos Style Studio $env:APP_VERSION" --notes $notes --generate-notes @flags
            if ($LASTEXITCODE -ne 0) { throw "Could not create the draft release for $tag." }
            return
          }

          if ($env:INSTALLER -cnotin $release.assets.name) {
            gh release upload $tag $asset
            if ($LASTEXITCODE -ne 0) { throw "Could not upload the installer for $tag." }
          }

          if ([string]::IsNullOrWhiteSpace($release.body)) {
            $generated = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$tag" --jq '.body'
            if ($LASTEXITCODE -ne 0) { throw "Could not generate release notes for $tag." }
            $body = $notes, ($generated -join "`n") -join "`n`n"
            gh release edit $tag --notes $body
            if ($LASTEXITCODE -ne 0) { throw "Could not update release notes for $tag." }
          }
